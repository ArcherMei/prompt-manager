name: Publish Windows 0.0.7
on:
  push:
    branches: [feature/danbooru-tag-lookup]
    paths: [.github/workflows/release-0.0.7.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-0.0.7
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/tag-lookup.test.js tests/update.test.js
      - run: npm run app:build -- --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item 'dist-electron/Prompt Manager Setup 0.0.7.exe' 'Prompt-Manager-Setup-0.0.7.exe'
          $hash = (Get-FileHash 'Prompt-Manager-Setup-0.0.7.exe' -Algorithm SHA256).Hash.ToLower()
          Set-Content 'SHA256SUMS-0.0.7.txt' "$hash  Prompt-Manager-Setup-0.0.7.exe"
          git archive --format=zip --output=prompt-manager-0.0.7-source.zip HEAD
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.0.7 --json isDraft > $null 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'v0.0.7 already exists; refusing to replace release assets.' }
          gh release create v0.0.7 --target $env:GITHUB_SHA --title 'Prompt Manager 0.0.7' --notes-file docs/RELEASE-0.0.7.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release upload v0.0.7 Prompt-Manager-Setup-0.0.7.exe SHA256SUMS-0.0.7.txt prompt-manager-0.0.7-source.zip docs/SCENE-LOOKUP.zh-CN.md
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains draft' }
          gh release edit v0.0.7 --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
